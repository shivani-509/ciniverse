```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVerse</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        #searchInput {
            width: 300px;
            max-width: 80%;
            padding: 12px;
            border: none;
            border-radius: 20px;
            margin-top: 15px;
            font-size: 16px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 15px;
            margin: 10px 5px;
        }

        .add-btn {
            background: white;
            color: #222;
        }

        .movies {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 30px;
        }

        .movie {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px #aaa;
        }

        .movie img {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }

        .movie-info {
            padding: 15px;
        }

        .movie-info h2 {
            margin-top: 0;
        }

        .delete-btn {
            background: #333;
            color: white;
        }

        .add-form {
            display: none;
            background: white;
            padding: 25px;
            margin: 25px auto;
            max-width: 500px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #aaa;
        }

        .add-form input,
        .add-form textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            font-size: 15px;
        }

        @media (max-width: 1000px) {
            .movies {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .movies {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🎬 CineVerse</h1>
    <p>Discover exciting stories, unforgettable adventures and your next favorite movie.</p>

    <input type="text" id="searchInput" placeholder="Search for a movie..." onkeyup="searchMovies()">
    <br>

    <button class="add-btn" onclick="showForm()">+ Add Movie</button>
</header>

<div class="add-form" id="addForm">
    <h2>Add a New Movie</h2>

    <input type="text" id="movieTitle" placeholder="Movie Title">
    <textarea id="movieDescription" placeholder="Movie Description"></textarea>
    <input type="text" id="movieImage" placeholder="Movie Poster Image URL">

    <button onclick="addMovie()">Add Movie</button>
    <button onclick="hideForm()">Cancel</button>
</div>

<div class="movies" id="movieContainer"></div>

<script>
    let movies = [
        {
            title: "Spider-Man: No Way Home",
            description: "Peter Parker asks Doctor Strange for help after his identity is revealed, but the spell opens the multiverse.",
            image: "https://image.tmdb.org/t/p/w500/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg"
        },
        {
            title: "The Batman",
            description: "Batman uncovers corruption in Gotham City while facing a mysterious serial killer known as the Riddler.",
            image: "https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg"
        },
        {
            title: "Avengers: Endgame",
            description: "The surviving Avengers assemble once more to reverse the damage caused by Thanos.",
            image: "https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg"
        },
        {
            title: "Inception",
            description: "A skilled thief who steals secrets through dreams is offered a chance to erase his criminal past.",
            image: "https://image.tmdb.org/t/p/w500/oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg"
        },
        {
            title: "Interstellar",
            description: "A group of explorers travel through a wormhole in space in search of a new home for humanity.",
            image: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg"
        },
        {
            title: "Joker",
            description: "A struggling comedian experiences events that lead him toward a violent transformation.",
            image: "https://image.tmdb.org/t/p/w500/udDclJoHjfjb8Ekgsd4FDteOkCU.jpg"
        },
        {
            title: "John Wick",
            description: "A retired hitman returns to his violent past after criminals steal his car and kill his dog.",
            image: "https://image.tmdb.org/t/p/w500/fZPSd91yGE9fCcCe6OoQr6E3Bev.jpg"
        },
        {
            title: "Black Panther",
            description: "T'Challa returns to Wakanda to take his rightful place as king and faces a powerful challenger.",
            image: "https://image.tmdb.org/t/p/w500/uxzzxijgPIY7slzFvMotPv8wjKA.jpg"
        }
    ];

    function displayMovies(list) {
        const container = document.getElementById("movieContainer");
        container.innerHTML = "";

        list.forEach((movie, index) => {
            container.innerHTML += `
                <div class="movie">
                    <img src="${movie.image}" alt="${movie.title}">
                    <div class="movie-info">
                        <h2>${movie.title}</h2>
                        <p>${movie.description}</p>
                        <button class="delete-btn" onclick="deleteMovie(${index})">Delete</button>
                    </div>
                </div>
            `;
        });
    }

    function showForm() {
        document.getElementById("addForm").style.display = "block";
    }

    function hideForm() {
        document.getElementById("addForm").style.display = "none";
    }

    function addMovie() {
        const title = document.getElementById("movieTitle").value;
        const description = document.getElementById("movieDescription").value;
        const image = document.getElementById("movieImage").value;

        if (!title || !description || !image) {
            alert("Please fill in all fields.");
            return;
        }

        movies.push({
            title: title,
            description: description,
            image: image
        });

        document.getElementById("movieTitle").value = "";
        document.getElementById("movieDescription").value = "";
        document.getElementById("movieImage").value = "";

        hideForm();
        displayMovies(movies);
    }

    function deleteMovie(index) {
        movies.splice(index, 1);
        displayMovies(movies);
    }

    function searchMovies() {
        const input = document.getElementById("searchInput").value.toLowerCase();

        const filtered = movies.filter(movie =>
            movie.title.toLowerCase().includes(input)
        );

        displayMovies(filtered);
    }

    displayMovies(movies);
</script>

</body>
</html>
```
