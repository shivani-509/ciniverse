<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVerse</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        #searchInput {
            width: 300px;
            max-width: 80%;
            padding: 12px;
            border: none;
            border-radius: 20px;
            margin-top: 15px;
            font-size: 16px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 15px;
            margin: 10px 5px;
        }

        .movies {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 30px;
        }

        .movie {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px #aaa;
        }

        .movie img {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }

        .movie-info {
            padding: 15px;
        }

        .movie-info h2 {
            margin-top: 0;
        }

        .add-form {
            display: none;
            background: white;
            padding: 25px;
            margin: 25px auto;
            max-width: 500px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #aaa;
        }

        .add-form input,
        .add-form textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            font-size: 15px;
        }

        .delete-btn {
            background: #333;
            color: white;
        }

        @media (max-width: 900px) {
            .movies {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .movies {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🎬 CineVerse</h1>
        <p>Discover exciting stories, unforgettable adventures and your next favorite movie.</p>

        <input
            type="text"
            id="searchInput"
            placeholder="Search for a movie..."
            onkeyup="searchMovies()"
        >

        <br>

        <button onclick="showForm()">+ Add Movie</button>
    </header>


    <div class="add-form" id="addForm">

        <h2>Add a New Movie</h2>

        <input
            type="text"
            id="movieTitle"
            placeholder="Movie Title"
        >

        <textarea
            id="movieDescription"
            placeholder="Movie Description"
        ></textarea>

        <input
            type="text"
            id="movieImage"
            placeholder="Movie Poster Image URL"
        >

        <button onclick="addMovie()">Add Movie</button>

        <button onclick="hideForm()">Cancel</button>

    </div>


    <div class="movies" id="movieContainer"></div>


    <script>

        // Load movies when page opens
        async function loadMovies() {

            try {

                const response = await fetch("/api/movies");

                const movies = await response.json();

                const container =
                    document.getElementById("movieContainer");

                container.innerHTML = "";

                movies.forEach(movie => {

                    container.innerHTML += `
                        <div class="movie">

                            <img
                                src="${movie.image}"
                                alt="${movie.title}"
                            >

                            <div class="movie-info">

                                <h2>${movie.title}</h2>

                                <p>${movie.description}</p>

                                <button
                                    class="delete-btn"
                                    onclick="deleteMovie('${movie._id}')"
                                >
                                    Delete
                                </button>

                            </div>

                        </div>
                    `;

                });

            } catch (error) {

                console.log("Could not load movies:", error);

            }

        }


        // Show Add Movie form
        function showForm() {

            document
                .getElementById("addForm")
                .style.display = "block";

        }


        // Hide Add Movie form
        function hideForm() {

            document
                .getElementById("addForm")
                .style.display = "none";

        }


        // Add a movie
        async function addMovie() {

            const title =
                document.getElementById("movieTitle").value;

            const description =
                document.getElementById("movieDescription").value;

            const image =
                document.getElementById("movieImage").value;


            if (!title || !description || !image) {

                alert("Please fill in all fields.");

                return;

            }


            try {

                await fetch("/api/movies", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        title,
                        description,
                        image
                    })

                });


                document.getElementById("movieTitle").value = "";
                document.getElementById("movieDescription").value = "";
                document.getElementById("movieImage").value = "";


                hideForm();

                loadMovies();

            } catch (error) {

                alert("Could not add movie.");

            }

        }


        // Delete a movie
        async function deleteMovie(id) {

            const confirmed =
                confirm("Are you sure you want to delete this movie?");


            if (!confirmed) return;


            try {

                await fetch(`/api/movies/${id}`, {

                    method: "DELETE"

                });


                loadMovies();

            } catch (error) {

                alert("Could not delete movie.");

            }

        }


        // Search movies
        function searchMovies() {

            const input =
                document
                    .getElementById("searchInput")
                    .value
                    .toLowerCase();


            const movies =
                document.querySelectorAll(".movie");


            movies.forEach(movie => {

                const title =
                    movie
                    .querySelector("h2")
                    .innerText
                    .toLowerCase();


                movie.style.display =
                    title.includes(input)
                    ? ""
                    : "none";

            });

        }


        // Start by loading movies
        loadMovies();

    </script>

</body>
</html>
